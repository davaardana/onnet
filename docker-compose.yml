version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: netpoint-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-netpoint_db}
      POSTGRES_USER: ${DB_USER:-netpoint_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-onnet123}
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - netpoint-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-netpoint_user} -d ${DB_NAME:-netpoint_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: netpoint-backend
    restart: unless-stopped
    ports:
      - "8001:5000"
    env_file:
      - ./backend/.env.production
    environment:
      - PORT=5000
      - NODE_ENV=production
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-netpoint_db}
      - DB_USER=${DB_USER:-netpoint_user}
      - DB_PASSWORD=${DB_PASSWORD:-onnet123}
      - DB_SSL=false
      - JWT_SECRET=${JWT_SECRET:-your_jwt_secret_key_here}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_CALLBACK_URL=https://api.netpoint.id/api/auth/google/callback
      - FRONTEND_URL=https://netpoint.id
      - CORS_ORIGIN=https://netpoint.id
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - netpoint-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    command: sh -c "sleep 5 && node server.js"

  # Frontend (Nginx)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: https://api.netpoint.id/api
        VITE_APP_NAME: Netpoint
        VITE_APP_TAGLINE: "Gateway to Connect Your Businesses to Indonesia"
    container_name: netpoint-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - netpoint-network

  # pgAdmin
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: netpoint-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@netpoint.com
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    networks:
      - netpoint-network
    depends_on:
      - postgres

volumes:
  postgres_data:
    driver: local

networks:
  netpoint-network:
    driver: bridge

