<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="netpoint-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="45%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0284c7" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Rounded Squircle Background -->
  <rect width="512" height="512" rx="116" fill="url(#netpoint-grad)"/>
  
  <!-- Inner Subtle Stroke -->
  <rect x="4" y="4" width="504" height="504" rx="112" fill="none" stroke="#ffffff" stroke-opacity="0.2" stroke-width="6"/>

  <!-- Network Topology Symbol -->
  <g filter="url(#glow)">
    <!-- Main Network Bus & Drops -->
    <path d="M168 336 v-64 a 20 20 0 0 1 20 -20 h 136 a 20 20 0 0 1 20 20 v 64" fill="none" stroke="#ffffff" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M256 252 V184" fill="none" stroke="#ffffff" stroke-width="26" stroke-linecap="round"/>
    
    <!-- Central Pulse Ring & Point -->
    <circle cx="256" cy="252" r="16" fill="#38bdf8" stroke="#ffffff" stroke-width="8"/>

    <!-- Top Server/Hub Node -->
    <rect x="200" y="88" width="112" height="96" rx="20" fill="#ffffff"/>
    <rect x="224" y="116" width="64" height="14" rx="7" fill="#0284c7"/>
    <circle cx="276" cy="154" r="6" fill="#0284c7"/>
    <circle cx="256" cy="154" r="6" fill="#38bdf8"/>
    <circle cx="236" cy="154" r="6" fill="#38bdf8"/>

    <!-- Bottom Left Node -->
    <rect x="112" y="336" width="112" height="96" rx="20" fill="#ffffff"/>
    <rect x="136" y="364" width="64" height="14" rx="7" fill="#0284c7"/>
    <circle cx="188" cy="402" r="6" fill="#0284c7"/>
    <circle cx="168" cy="402" r="6" fill="#38bdf8"/>
    <circle cx="148" cy="402" r="6" fill="#38bdf8"/>

    <!-- Bottom Right Node -->
    <rect x="288" y="336" width="112" height="96" rx="20" fill="#ffffff"/>
    <rect x="312" y="364" width="64" height="14" rx="7" fill="#0284c7"/>
    <circle cx="364" cy="402" r="6" fill="#0284c7"/>
    <circle cx="344" cy="402" r="6" fill="#38bdf8"/>
    <circle cx="324" cy="402" r="6" fill="#38bdf8"/>
  </g>
</svg>
